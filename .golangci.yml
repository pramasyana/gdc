run:
  timeout: 3m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - gosec
    - ineffassign
    - unused
    - misspell
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/ryanpramasyana/gdc
  revive:
    rules:
      - name: exported
        disabled: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
